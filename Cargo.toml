[workspace]
resolver = "3"
members = ["crates/engine-sim", "crates/engine-sim-wasm", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true

# The physics tests render seconds of audio; unoptimised, they would take many minutes.
[profile.test]
opt-level = 3

# `tauri dev` builds unoptimised, and the simulation must still run in real time there.
[profile.dev.package.engine-sim]
opt-level = 3
