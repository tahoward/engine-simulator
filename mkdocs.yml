site_name: Engine Simulator
site_description: Engines from a single to a V8, simulated from physics in the browser, with an exhaust you build yourself.
site_url: https://tahoward.github.io/engine-simulator/
repo_url: https://github.com/tahoward/engine-simulator
repo_name: tahoward/engine-simulator
edit_uri: edit/main/docs/

# The published site is assembled with these pages at the root and the built
# simulator dropped in alongside them under app/, so the docs are what a
# visitor lands on and the simulator is one link away. See docs/deployment.md.
site_dir: site
docs_dir: docs

theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Controls: controls.md
  - Internals:
      - Architecture: architecture.md
      - Acoustics: acoustics.md
      - The Engine: engine.md
      - Performance: performance.md
  - Verification: verification.md
  - Known Limits: limits.md
  - Glossary: glossary.md
  - References: references.md
  - Deployment: deployment.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  # Renders :material-*: and :fontawesome-*: shortcodes as inline SVG icons.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# Broken internal links fail the build rather than shipping quietly, since the
# deploy workflow is the only thing that builds these pages.
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tahoward/engine-simulator
      name: Source on GitHub
