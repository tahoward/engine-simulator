name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vite 8 and Vitest 5 need Node 20.19 or newer.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: npm ci

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      # The docs are the site root and the simulator is served from app/ beneath
      # them, so the two builds are assembled into one artifact. The app's base
      # path is relative, so it needs nothing to match the destination below —
      # see docs/deployment.md.
      - name: Build docs
        run: mkdocs build --strict

      - name: Build app
        run: npm run build

      - name: Assemble site
        run: mv dist site/app

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
